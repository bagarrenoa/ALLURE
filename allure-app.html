function passportScreen() {
  var discoveredIds = Object.keys(state.discoveredBrands).filter(function (id) { return state.discoveredBrands[id]; });

  var level = discoveredIds.length >= totalBrandsAll ? 3 : discoveredIds.length >= Math.ceil(totalBrandsAll / 2) ? 2 : 1;
  var badgePct = Math.round((discoveredIds.length / totalBrandsAll) * 100);

  var badgesHtml = Object.keys(WORLD_REGIONS).map(function (key) {
    var region = WORLD_REGIONS[key];
    var done = region.brands.every(function (id) { return state.discoveredBrands[id]; });
    var count = region.brands.filter(function (id) { return state.discoveredBrands[id]; }).length;
    return '<div style="display:flex;align-items:center;gap:12px;background:' + C.card2 + ';border:1px solid ' + C.line + ';border-radius:12px;padding:12px;margin-bottom:10px;opacity:' + (done ? "1" : "0.55") + '">' +
      '<div style="width:40px;height:40px;border-radius:999px;background:' + (done ? GRAD : "rgba(255,255,255,0.08)") + ';display:flex;align-items:center;justify-content:center;font-size:18px">' + region.flag + "</div>" +
      '<div style="flex:1"><div style="font-weight:700;font-size:13px">Explorateur ' + region.name + '</div><div style="font-size:11px;color:' + C.muted + '">' + count + "/" + region.brands.length + " marques découvertes</div></div>" +
      (done ? ICONS.check(18, C.p2) : "") + "</div>";

  return '<div style="height:100%;display:flex;flex-direction:column">' + header("Passeport Allure", true) +
    '<div class="no-scrollbar" style="flex:1;overflow-y:auto;padding:16px">' +
    '<div style="background:linear-gradient(160deg, #2c1a58, #0B0B14 75%);border:1px solid ' + C.line + ';border-radius:18px;padding:22px;margin-bottom:20px;position:relative;overflow:hidden">' +
    '<div style="position:absolute;inset:0;background:radial-gradient(circle at 80% 0%, rgba(193,77,255,0.3), transparent 60%)"></div>' +
    '<div style="position:relative;font-size:11px;letter-spacing:2px;color:' + C.p2 + ';font-weight:700;margin-bottom:4px">PASSEPORT ALLURE</div>' +
    '<div style="position:relative;font-size:18px;font-weight:700;margin-bottom:18px">Exploratrice de mode · Niveau ' + level + "</div>" +
    '<div style="position:relative;display:flex;justify-content:space-between;text-align:center">' +
    '<div><div style="font-weight:700;font-size:16px">' + countriesVisited + "/" + totalCountries + '</div><div style="font-size:10px;color:' + C.muted + '">Pays visités</div></div>' +
    '<div><div style="font-weight:700;font-size:16px">' + discoveredIds.length + "/" + totalBrandsAll + '</div><div style="font-size:10px;color:' + C.muted + '">Marques</div></div>' +
    '<div><div style="font-weight:700;font-size:16px">' + discoveredIds.length + '</div><div style="font-size:10px;color:' + C.muted + '">Ateliers</div></div>' +
    '<div><div style="font-weight:700;font-size:16px">' + produitsLikes + '</div><div style="font-size:10px;color:' + C.muted + '">Sauvegardés</div></div></div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Prochain badge · Explorateur du monde</span><span style="color:' + C.p2 + ';font-weight:700">' + discoveredIds.length + "/" + totalBrandsAll + "</span></div>" +
    '<div style="height:8px;background:' + C.card2 + ';border-radius:999px;overflow:hidden;margin-bottom:22px"><div style="height:100%;width:' + badgePct + '%;background:' + GRAD + '"></div></div>' +
    '<div style="font-size:13px;font-weight:700;margin-bottom:10px">Badges par pays</div>' + badgesHtml +
    '<div style="font-size:11.5px;color:' + C.muted + ';text-align:center;margin-top:10px;line-height:1.6">Continue d\'explorer le globe pour débloquer de nouveaux badges et découvrir toutes les marques indépendantes du monde.</div>' +
    "</div></div>";
}

    case "feed": return feedScreen();

function render() {
  var app = document.getElementById("app");
  if (!state.launched) {
    app.innerHTML = splashScreen();
    attachHandlers(app);
    return;
  }
  var cur = current();
  var navHtml = TABS.map(function (t) {
    var active = state.tab === t.key && state.stack.length === 0;
    var inner = t.key === "create"
      ? '<div style="width:28px;height:28px;border-radius:999px;background:' + GRAD + ';display:flex;align-items:center;justify-content:center">' + ICONS[t.icon](16, "#fff") + "</div>"
      : ICONS[t.icon](20, active ? C.p2 : C.muted);
    return '<button data-action="goTab" data-tab="' + t.key + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:' + (active ? "#fff" : C.muted) + '">' + inner + '<span style="font-size:9.5px;font-weight:600">' + t.label + "</span></button>";
  }).join("");
  var cartBtn = "";
  if ((cur.type === "feed" || cur.type === "search") && cartCount() > 0) {
    cartBtn = '<button data-action="goCart" style="position:absolute;right:16px;bottom:90px;width:46px;height:46px;border-radius:999px;background:' + GRAD + ';display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(138,43,255,0.4)">' +
      ICONS.bag(19, "#fff") + '<span style="position:absolute;top:-4px;right:-4px;background:#fff;color:' + C.p1 + ';font-size:10px;font-weight:700;border-radius:999px;width:18px;height:18px;display:flex;align-items:center;justify-content:center">' + cartCount() + "</span></button>";
  }
  app.innerHTML =
    '<div style="flex:1;position:relative;overflow:hidden">' + screenHtml(cur) + "</div>" +
    '<div style="display:flex;border-top:1px solid ' + C.line + ';background:' + C.bg + ';flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)">' + navHtml + "</div>" + cartBtn;
  attachHandlers(app);
}

function attachHandlers(app) {
  var input = document.getElementById("searchInput");
  if (input) {
    input.value = state.searchQuery;
    input.addEventListener("input", function (e) { state.searchQuery = e.target.value; });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { state.searchShowResults = true; render(); } });
  }

  var onGlobeScreen = state.launched && current().type === "globe";
  var use3DNow = THREE_OK && GLOBE_LIBS_OK && !worldGeoFailed && !three3DFailed;
  var use2DNow = !use3DNow && GLOBE_LIBS_OK && !worldGeoFailed;
  if (onGlobeScreen && use3DNow) {
    initGlobe3D();
    if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
  } else if (onGlobeScreen && use2DNow) {
    initRealGlobe();
    if (three_rAF) { cancelAnimationFrame(three_rAF); three_rAF = null; }
    if (three_renderer) { try { three_renderer.dispose(); } catch (e) {} three_renderer = null; }
  } else {
    if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
    if (three_rAF) { cancelAnimationFrame(three_rAF); three_rAF = null; }
    if (three_renderer) { try { three_renderer.dispose(); } catch (e) {} three_renderer = null; }
  }
}

function buildWorldTexture() {
  if (world2DCanvas || !worldGeo) return;
  var w = 1024, h = 512;
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  var tctx = c.getContext("2d");
  var grad = tctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#22134a");
  grad.addColorStop(1, "#0a0620");
  tctx.fillStyle = grad; tctx.fillRect(0, 0, w, h);
  var proj = d3.geoEquirectangular().scale(w / (2 * Math.PI)).translate([w / 2, h / 2]);
  var tpath = d3.geoPath(proj, tctx);
  tctx.save();
  tctx.shadowColor = "rgba(193,77,255,0.9)";
  tctx.shadowBlur = 6;
  tctx.beginPath();
  worldGeo.features.forEach(function (f) { tpath(f); });
  tctx.fillStyle = "rgba(168,90,255,0.6)";
  tctx.fill();
  tctx.restore();
  tctx.beginPath();
  worldGeo.features.forEach(function (f) { tpath(f); });
  tctx.lineWidth = 0.8; tctx.strokeStyle = "rgba(235,210,255,0.6)"; tctx.stroke();
  world2DCanvas = c;
}

function latLonToVec3(lat, lon, r) {
  var phi = (90 - lat) * (Math.PI / 180);
  var theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

function initGlobe3D() {
  var canvas = document.getElementById("globe3dCanvas");
  if (!canvas) return;
  try {
    if (three_renderer) { try { three_renderer.dispose(); } catch (e) {} three_renderer = null; }
    if (three_rAF) { cancelAnimationFrame(three_rAF); three_rAF = null; }

    var size = canvas.width;
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 10);
    camera.position.set(0, 0, 2.6);

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(size, size, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    three_renderer = renderer;

    var group = new THREE.Group();
    scene.add(group);

    buildWorldTexture();
    var globeMat;
    if (world2DCanvas) {
      var tex = new THREE.CanvasTexture(world2DCanvas);
      globeMat = new THREE.MeshPhongMaterial({ map: tex, shininess: 10, specular: 0x8A2BFF, emissive: 0x140a30, emissiveIntensity: 0.4 });
    } else {
      globeMat = new THREE.MeshPhongMaterial({ color: 0x1c1044, shininess: 10, specular: 0x8A2BFF, emissive: 0x140a30, emissiveIntensity: 0.4 });
    }
    var globeGeo = new THREE.SphereGeometry(1, 48, 48);
    var globeMesh = new THREE.Mesh(globeGeo, globeMat);
    group.add(globeMesh);

    var atmosGeo = new THREE.SphereGeometry(1.05, 32, 32);
    var atmosMat = new THREE.MeshBasicMaterial({ color: 0xC14DFF, transparent: true, opacity: 0.14, side: THREE.BackSide });
    scene.add(new THREE.Mesh(atmosGeo, atmosMat));

    scene.add(new THREE.AmbientLight(0x9955ff, 0.55));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(2.5, 1.8, 3);
    scene.add(dirLight);

    three_pins = [];
    Object.keys(WORLD_REGIONS).forEach(function (key) {
      var coord = REGION_COORDS[key];
      var pos = latLonToVec3(coord[1], coord[0], 1.02);
      var pinGeo = new THREE.SphereGeometry(0.045, 12, 12);
      var pinMat = new THREE.MeshBasicMaterial({ color: state.globeSelectedPin === key ? 0xffffff : 0xC14DFF });
      var pinMesh = new THREE.Mesh(pinGeo, pinMat);
      pinMesh.position.copy(pos);
      pinMesh.userData.regionKey = key;
      group.add(pinMesh);
      three_pins.push(pinMesh);
    });

    if (!world2DCanvas && !worldGeoFetching && !worldGeo) {
      worldGeoFetching = true;
      fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
        .then(function (r) { return r.json(); })
        .then(function (topo) {
          worldGeo = topojson.feature(topo, topo.objects.countries);
          buildWorldTexture();
          render();
        })
        .catch(function () {
          worldGeoFailed = true;
          render();
        });
    }

    if (!three_dragBound) {
      three_dragBound = false; // rebind each fresh canvas (new element each render)
    }
    var ds = three_dragState;
    ds.dragging = false; ds.moved = false;
    canvas.addEventListener("pointerdown", function (e) {
      ds.dragging = true; ds.moved = false;
      ds.x = e.clientX; ds.y = e.clientY;
      ds.startRotY = group.rotation.y; ds.startRotX = group.rotation.x;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!ds.dragging) return;
      var dx = e.clientX - ds.x, dy = e.clientY - ds.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) ds.moved = true;
      group.rotation.y = ds.startRotY + dx * 0.01;
      group.rotation.x = Math.max(-1.1, Math.min(1.1, ds.startRotX + dy * 0.01));
    });
    canvas.addEventListener("pointerup", function () { ds.dragging = false; });
    canvas.addEventListener("pointercancel", function () { ds.dragging = false; });
    canvas.addEventListener("click", function (e) {
      if (ds.moved) { ds.moved = false; return; }
      var rect = canvas.getBoundingClientRect();
      var mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      var raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      scene.updateMatrixWorld(true);
      var hits = raycaster.intersectObjects(three_pins, false);
      if (hits.length) {
        state.globeSelectedPin = hits[0].object.userData.regionKey;
        render();
      }
    });

    (function frame() {
      try {
        if (!ds.dragging) group.rotation.y += 0.0018;
        var t = performance.now() / 1000;
        three_pins.forEach(function (p, i) { p.scale.setScalar(1 + 0.18 * Math.sin(t * 2.2 + i)); });
        renderer.render(scene, camera);
        three_rAF = requestAnimationFrame(frame);
      } catch (err) {
        three3DFailed = true;
        if (three_rAF) { cancelAnimationFrame(three_rAF); three_rAF = null; }
        render();
      }
    })();
  } catch (err) {
    three3DFailed = true;
    if (three_rAF) { cancelAnimationFrame(three_rAF); three_rAF = null; }
    render();
  }
}

function initRealGlobe() {
  var canvas = document.getElementById("globeCanvas");
  if (!canvas) return;
  var size = canvas.width;
  var ctx = canvas.getContext("2d");
  var projection = d3.geoOrthographic().scale(size / 2.15).translate([size / 2, size / 2]).clipAngle(90).precision(0.4);
  var path = d3.geoPath(projection, ctx);

  function drawGlobe() {
    projection.rotate(globeRotation);
    ctx.clearRect(0, 0, size, size);

    var oceanGrad = ctx.createRadialGradient(size * 0.36, size * 0.3, size * 0.03, size * 0.5, size * 0.5, size * 0.56);
    oceanGrad.addColorStop(0, "#2c1a58");
    oceanGrad.addColorStop(0.55, "#160c38");
    oceanGrad.addColorStop(1, "#08050f");
    ctx.beginPath(); path({ type: "Sphere" });
    ctx.fillStyle = oceanGrad; ctx.fill();

    if (worldGeo) {
      ctx.save();
      ctx.shadowColor = "rgba(193,77,255,0.95)";
      ctx.shadowBlur = 7;
      ctx.beginPath();
      worldGeo.features.forEach(function (f) { path(f); });
      ctx.fillStyle = "rgba(168,90,255,0.5)";
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      worldGeo.features.forEach(function (f) { path(f); });
      ctx.lineWidth = 0.5;
      ctx.strokeStyle = "rgba(230,200,255,0.55)";
      ctx.stroke();
    }

    ctx.save();
    ctx.shadowColor = "rgba(193,77,255,0.85)";
    ctx.shadowBlur = 16;
    ctx.beginPath(); path({ type: "Sphere" });
    ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(193,77,255,0.7)"; ctx.stroke();
    ctx.restore();

    var t = performance.now() / 1000;
    var center = [-projection.rotate()[0], -projection.rotate()[1]];
    Object.keys(WORLD_REGIONS).forEach(function (key) {
      var coord = REGION_COORDS[key];
      var visible = d3.geoDistance(coord, center) < 1.4;
      if (!visible) { globePinScreenPos[key] = { visible: false }; return; }
      var p = projection(coord);
      if (!p) { globePinScreenPos[key] = { visible: false }; return; }
      globePinScreenPos[key] = { x: p[0], y: p[1], visible: true };
      var active = state.globeSelectedPin === key;

      var phase = ((t + key.length) % 1.6) / 1.6;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 5 + phase * 16, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(193,77,255," + (0.55 * (1 - phase)) + ")";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.shadowColor = "#C14DFF"; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(p[0], p[1], active ? 6.5 : 5, 0, 2 * Math.PI);
      ctx.fillStyle = active ? "#fff" : "#C14DFF";
      ctx.fill();
      ctx.restore();
    });
  }

  if (!worldGeo && !worldGeoFetching) {
    worldGeoFetching = true;
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(function (r) { return r.json(); })
      .then(function (topo) {
        worldGeo = topojson.feature(topo, topo.objects.countries);
      })
      .catch(function () {
        worldGeoFailed = true;
        if (globeRAF) { cancelAnimationFrame(globeRAF); globeRAF = null; }
        render();
      });
  }

  if (!canvas._dragBound) {
    canvas._dragBound = true;
    var dragStart = null;
    var dragMoved = false;
    canvas.addEventListener("pointerdown", function (e) {
      globeDragging = true;
      dragMoved = false;
      dragStart = { x: e.clientX, y: e.clientY, r: globeRotation.slice() };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!globeDragging || !dragStart) return;
      var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
      globeRotation[0] = dragStart.r[0] + dx * 0.4;
      globeRotation[1] = Math.max(-80, Math.min(80, dragStart.r[1] - dy * 0.4));
    });
    canvas.addEventListener("pointerup", function () { globeDragging = false; });
    canvas.addEventListener("pointercancel", function () { globeDragging = false; });
    canvas.addEventListener("click", function (e) {
      if (dragMoved) { dragMoved = false; return; }
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var x = (e.clientX - rect.left) * scaleX;
      var y = (e.clientY - rect.top) * scaleX;
      var closestKey = null, closestDist = 20 * scaleX;
      Object.keys(globePinScreenPos).forEach(function (k) {
        var p = globePinScreenPos[k];
        if (!p.visible) return;
        var d = Math.hypot(p.x - x, p.y - y);
        if (d < closestDist) { closestDist = d; closestKey = k; }
      });
      if (closestKey) { state.globeSelectedPin = closestKey; render(); }
    });
  }

  if (globeRAF) cancelAnimationFrame(globeRAF);
  (function frame() {
    if (!globeDragging) globeRotation[0] += 0.12;
    drawGlobe();
    globeRAF = requestAnimationFrame(frame);
  })();
}

document.getElementById("app").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  switch (action) {
    case "launch": state.launched = true; render(); break;
    case "goTab": state.tab = el.dataset.tab; state.stack = []; render(); break;
    case "push":
      if (el.dataset.screen === "brandStory") { state.brandStoryTab = "histoire"; state.discoveredBrands[id] = true; }
      if (el.dataset.screen === "region") state.regionTab = "apercu";
      state.stack.push({ type: el.dataset.screen, id: id });
      render();
      break;
    case "goPassport": state.stack.push({ type: "passport" }); render(); break;
    case "choosePlan": state.stack.push({ type: "planConfirmed", id: id }); render(); break;
    case "resetToProfile": state.stack = []; state.tab = "profile"; render(); break;
    case "setFeedTab": state.feedTab = el.dataset.tab; render(); break;
    case "setAbonnementsFilter": state.abonnementsFilter = id; state.showFilterMenu = false; render(); break;
    case "setAbonnementsSort": state.abonnementsSort = el.dataset.tab; state.showSortMenu = false; render(); break;
    case "toggleFilterMenu": state.showFilterMenu = !state.showFilterMenu; state.showSortMenu = false; render(); break;
    case "toggleSortMenu": state.showSortMenu = !state.showSortMenu; state.showFilterMenu = false; render(); break;
    case "toggleNotifPref": state.notifPrefs[id] = state.notifPrefs[id] === false ? true : false; render(); break;
    case "unfollow": state.following[id] = false; render(); break;
    case "setRegionTab": state.regionTab = el.dataset.tab; render(); break;
    case "pop": state.stack.pop(); render(); break;
    case "closeSearchResults": state.searchShowResults = false; render(); break;
    case "toggleLike": state.likes.videos[id] = !state.likes.videos[id]; render(); break;
    case "toggleProductLike": state.likes.products[id] = !state.likes.products[id]; render(); break;
    case "toggleLookLike": state.likes.looks[id] = !state.likes.looks[id]; render(); break;
    case "selectColor": productUI(id).color = parseInt(el.dataset.idx, 10); render(); break;
    case "selectSize": productUI(id).size = el.dataset.size; render(); break;
    case "addToCart":
      var ui = productUI(id);
      state.cart.push({ id: id, size: ui.size, color: ui.color, qty: 1 });
      state.addedFlash = id;
      render();
      setTimeout(function () { if (state.addedFlash === id) { state.addedFlash = null; render(); } }, 1400);
      break;
    case "follow": state.following[id] = !state.following[id]; render(); break;
    case "updateQty":
      var idx = parseInt(el.dataset.idx, 10), delta = parseInt(el.dataset.delta, 10);
      state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
      render();
      break;
    case "goCart": state.stack.push({ type: "cart" }); render(); break;
    case "goCheckout": state.stack.push({ type: "checkout" }); render(); break;
    case "pay": state.stack.push({ type: "confirmed" }); render(); break;
    case "resetAll": state.cart = []; state.stack = []; state.tab = "feed"; render(); break;
    case "setDressingTab": state.dressingTab = el.dataset.tab; render(); break;
    case "setProfileTab": state.profileTab = el.dataset.tab; render(); break;
    case "setLikesTab": state.likesTab = el.dataset.tab; render(); break;
    case "openLikedProduct": state.stack.push({ type: "product", id: id }); render(); break;
    case "openLikedBrand":
      state.stack.push({ type: BRANDS[id] ? "brand" : "brandStory", id: id });
      render();
      break;
    case "openLikedLook": state.stack.push({ type: "generatedOutfit", id: id }); render(); break;
    case "goDressing": state.stack.push({ type: "dressing" }); render(); break;
    case "toggleOutfitPiece":
      var i = state.createOutfitSelected.indexOf(id);
      if (i >= 0) state.createOutfitSelected.splice(i, 1); else state.createOutfitSelected.push(id);
      render();
      break;
    case "generateOutfit":
      if (state.createOutfitSelected.length) {
        state.stack.push({ type: "generatedOutfit", custom: state.createOutfitSelected.slice() });
        state.createOutfitSelected = [];
        render();
      }
      break;
    case "selectPin": state.globeSelectedPin = el.dataset.region; render(); break;
    case "setBrandStoryTab": state.brandStoryTab = el.dataset.tab; render(); break;
    case "pillSearch": state.searchQuery = el.dataset.query; state.searchShowResults = true; render(); break;
    case "showResults": state.searchShowResults = true; render(); break;
    case "noop": break;
  }
});

render();
</script>
